<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Store — Demo Product</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">Nova Store</header>
<main class="product">
  <div class="product-media" aria-hidden="true">NOVA</div>
  <h1>Nova Everyday Sneaker</h1>
  <p class="price">$89.00</p>
  <p class="desc">Lightweight demo product used only by the Autonomous Commerce Repair Agent test storefront.</p>
  <p class="cart-status">Cart: <span id="cart-count">0</span> item(s)</p>
  <button id="add-to-cart" class="add-to-cart" type="button">Add to Cart</button>
</main>
<div class="sticky-promo" id="sticky-promo">Free shipping today — no code needed</div>
<script src="app.js"></script>
</body>
</html>
